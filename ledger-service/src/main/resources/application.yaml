spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5434/ledger
    username: ledger
    password: ledger
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE